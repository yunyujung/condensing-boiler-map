<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘덴싱 보일러 MAP</title>

  <!-- Tailwind CSS CDN -->
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"맑은 고딕"', "system-ui", "sans-serif"],
            },
          },
        },
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-slate-100 font-sans">

  <!-- 상단 패널 -->
  <div id="topPanel"
       class="bg-white shadow-md rounded-b-3xl pt-6 pb-4">
    <div class="max-w-3xl mx-auto px-4">

      <!-- 제목 -->
      <header class="text-3xl sm:text-4xl font-extrabold text-center mb-1">
        콘덴싱 보일러 MAP
      </header>

      <!-- 서브텍스트 -->
      <div class="text-sm sm:text-base text-slate-600 text-center mb-4">
        주소를 검색하면 해당 지역 난방유형을 확인할 수 있습니다.
      </div>

      <!-- 검색 박스 -->
      <div id="searchBox" class="mt-2">
        <input
          id="addr"
          class="w-full px-4 py-3 sm:py-4 text-lg sm:text-xl font-semibold text-center border-2 border-slate-500 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="주소를 입력하세요"
        >
        <button
          onclick="searchAddress()"
          class="w-full mt-3 py-3 sm:py-4 text-lg sm:text-xl font-bold rounded-2xl bg-blue-600 hover:bg-blue-700 text-white transition-colors">
          🔍 주소 검색
        </button>
      </div>

      <!-- 에러 메시지 -->
      <div
        id="errorBox"
        class="mt-3 px-4 py-3 text-sm sm:text-base rounded-2xl border-2 border-red-400 bg-red-50 text-red-800 hidden">
      </div>

      <!-- 검색 결과 리스트 -->
      <div
        id="resultBox"
        class="mt-3 border border-slate-200 bg-white rounded-2xl shadow-sm overflow-hidden hidden">

        <div id="resultHeader"
             class="flex justify-between items-center px-4 py-2 bg-slate-50 text-sm sm:text-base font-semibold text-slate-700">
          <span>주소</span>
          <span>우편번호</span>
        </div>

        <div id="resultList"></div>
      </div>

      <!-- 난방유형 안내 -->
      <div
        id="infoBox"
        class="mt-3 px-4 py-4 text-xl sm:text-2xl font-bold rounded-2xl hidden">
      </div>

      <!-- 필터 버튼 -->
      <div
        id="filterBox"
        class="mt-3 flex flex-wrap justify-center gap-3">
        <button
          class="filterBtn flex-1 min-w-[140px] max-w-[200px] px-4 py-2 text-base sm:text-lg rounded-full border-2 border-slate-300 bg-white hover:bg-slate-50 transition-colors"
          onclick="filterType('콘덴싱보일러', this)">
          콘덴싱보일러
        </button>
        <button
          class="filterBtn flex-1 min-w-[140px] max-w-[200px] px-4 py-2 text-base sm:text-lg rounded-full border-2 border-slate-300 bg-white hover:bg-slate-50 transition-colors"
          onclick="filterType('일반형보일러', this)">
          일반형보일러
        </button>
        <button
          class="filterBtn flex-1 min-w-[140px] max-w-[200px] px-4 py-2 text-base sm:text-lg rounded-full border-2 border-slate-300 bg-white hover:bg-slate-50 transition-colors"
          onclick="filterType('중앙난방', this)">
          중앙난방
        </button>
        <button
          class="filterBtn flex-1 min-w-[140px] max-w-[200px] px-4 py-2 text-base sm:text-lg rounded-full border-2 border-slate-300 bg-white hover:bg-slate-50 transition-colors"
          onclick="filterType('지역난방', this)">
          지역난방
        </button>
      </div>

    </div>
  </div>

  <!-- 지도 타이틀 -->
  <div class="text-center text-xs sm:text-sm font-semibold text-slate-600 py-3">
    ※ 아래 지도는 참고용입니다
  </div>

  <!-- 지도 -->
  <div class="max-w-5xl mx-auto px-4 pb-6">
    <div id="map" class="w-full h-[60vh] rounded-2xl shadow-md border border-slate-200"></div>
  </div>

  <!-- Kakao Map SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=485d2de99e1aa2076405dfb51411b5d7&libraries=services&autoload=false"></script>

  <script>
    kakao.maps.load(function() {

      let map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(36.3, 127.9),
        level: 11
      });

      let geocoder = new kakao.maps.services.Geocoder();
      let places   = new kakao.maps.services.Places();

      let currentOverlays = [];
      let allPoints = [];

      // 🔹 난방유형 DB (예시)
      const heatAddrDB = {
        "헬리오시티": "지역난방",
        "래미안퍼스티지": "지역난방",
        "국회대로76길22": "콘덴싱보일러"
      };

      function normalizeText(t) {
        if (!t) return "";
        return t.toString().trim()
          .replace(/\s+/g, "")
          .replace(/-/g, "")
          .replace(/[^\uAC00-\uD7A3a-zA-Z0-9]/g, "")
          .toLowerCase();
      }

      function extractBuildingNameFromResult(r) {
        let name = "";
        if (r.road_address && r.road_address.building_name) name = r.road_address.building_name;
        else if (r.address && r.address.building_name) name = r.address.building_name;
        else if (r.address && r.address.bname) name = r.address.bname;
        return normalizeText(name);
      }

      function getColor(type) {
        if (type === "콘덴싱보일러") return "green";
        if (type === "일반형보일러") return "red";
        if (type === "중앙난방" || type === "지역난방") return "gray";
        return "black";
      }

      function showError(msg) {
        let box = document.getElementById("errorBox");
        box.classList.remove("hidden");
        box.textContent = msg;
      }

      function clearOverlays() {
        currentOverlays.forEach(o => o.setMap(null));
        currentOverlays = [];
      }

      window.searchAddress = function() {

        document.getElementById("errorBox").classList.add("hidden");

        let keyword = document.getElementById("addr").value.trim();
        if (!keyword) {
          alert("주소를 입력하세요!");
          return;
        }

        geocoder.addressSearch(keyword, function(result, status) {

          if (status === kakao.maps.services.Status.OK) {
            showResult(result);
            return;
          }

          // 도로명 검색 안되면 키워드 검색
          places.keywordSearch(keyword, function(res, stat) {
            if (stat === kakao.maps.services.Status.OK) {
              showResult(res);
            } else {
              showError("주소 검색이 실패했습니다.");
            }
          });

        });
      };

      function getZip(r) {
        return (r.road_address && r.road_address.zone_no) ? r.road_address.zone_no :
               (r.zone_no) ? r.zone_no :
               (r.address && r.address.zip_code) ? r.address.zip_code :
               "미확인";
      }

      function showResult(result) {

        let box  = document.getElementById("resultBox");
        let list = document.getElementById("resultList");
        list.innerHTML = "";
        box.classList.remove("hidden");

        document.getElementById("infoBox").classList.add("hidden");

        let used = new Set();

        result.forEach(r => {

          let full =
            r.road_address ? r.road_address.address_name :
            r.address_name ? r.address_name :
            r.address ? r.address.address_name :
            r.place_name || "주소 미확인";

          let building =
            (r.road_address && r.road_address.building_name) ? r.road_address.building_name :
            (r.address && r.address.building_name) ? r.address.building_name :
            (r.address && r.address.bname) ? r.address.bname :
            "-";

          let zip = getZip(r);

          if (!used.has(full)) {
            used.add(full);

            let row = document.createElement("div");
            row.className =
              "resultRow flex justify-between items-start px-4 py-3 border-t border-slate-100 text-sm sm:text-base cursor-pointer hover:bg-slate-50 transition-colors";

            row.innerHTML = `
              <div class="pr-3">
                <div class="font-medium text-slate-900">${full}</div>
                <div class="mt-1 text-xs sm:text-sm text-slate-500">
                  ${building !== "-" ? "🏢 " + building : ""}
                </div>
              </div>
              <div class="text-right text-sm sm:text-base text-slate-700">${zip}</div>
            `;

            row.onclick = function () { selectAddress(r); };
            list.appendChild(row);
          }
        });
      }

      window.selectAddress = function(r) {

        document.getElementById("resultBox").classList.add("hidden");

        let address =
          r.road_address ? r.road_address.address_name :
          r.address_name ? r.address_name :
          r.address ? r.address.address_name :
          "주소 정보 없음";

        let key1 = normalizeText(address);
        let key2 = extractBuildingNameFromResult(r);

        let heatType =
          heatAddrDB[key1] ||
          heatAddrDB[key2] ||
          "정보없음";

        let color = getColor(heatType);

        let info = document.getElementById("infoBox");
        info.classList.remove("hidden");

        if (heatType === "정보없음") {
          info.className =
            "mt-3 px-4 py-4 text-xl sm:text-2xl font-bold rounded-2xl bg-slate-900 text-white";
          info.innerHTML =
            `해당 지역은 <span class="text-amber-300">정보가 없는 지역</span>입니다.`;
        } else {
          info.className =
            "mt-3 px-4 py-4 text-xl sm:text-2xl font-bold rounded-2xl bg-blue-50 text-slate-900";
          info.innerHTML =
            `해당 지역은 <span style="color:${color}; text-decoration:underline;">${heatType}</span> 설치지역입니다.`;
        }

        let coords = new kakao.maps.LatLng(r.y, r.x);
        map.setCenter(coords);
        map.setLevel(5);

        if (heatType !== "정보없음") {
          allPoints.push({
            lat: parseFloat(r.y),
            lng: parseFloat(r.x),
            type: heatType
          });
        }

        clearOverlays();

        let marker = new kakao.maps.Marker({ position: coords });
        marker.setMap(map);
        currentOverlays.push(marker);
      };

      window.filterType = function(type, btnElement) {

        if (allPoints.length === 0) {
          alert("먼저 주소를 검색해서 데이터를 쌓아주세요.");
          return;
        }

        // 버튼 active 스타일 토글
        let btns = document.querySelectorAll(".filterBtn");
        btns.forEach(b => {
          b.classList.remove("border-blue-600", "bg-blue-50");
          b.classList.add("border-slate-300", "bg-white");
        });

        if (btnElement) {
          btnElement.classList.remove("border-slate-300", "bg-white");
          btnElement.classList.add("border-blue-600", "bg-blue-50");
        }

        clearOverlays();

        let bounds = new kakao.maps.LatLngBounds();
        let hasAny = false;

        allPoints
          .filter(p => p.type === type)
          .forEach(p => {
            hasAny = true;
            let pos = new kakao.maps.LatLng(p.lat, p.lng);
            bounds.extend(pos);

            let marker = new kakao.maps.Marker({ position: pos });
            marker.setMap(map);
            currentOverlays.push(marker);
          });

        if (!hasAny) {
          alert(type + " 데이터가 아직 없습니다.");
          return;
        }

        map.setBounds(bounds);
      };

    });
  </script>

</body>
</html>
