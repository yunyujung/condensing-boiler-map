<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울시 공동주택 콘덴싱 보일러 설치 맵</title>

  <!-- Tailwind CSS CDN -->
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"맑은 고딕"', "system-ui", "sans-serif"],
            },
          },
        },
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-slate-950 font-sans text-slate-100">

  <!-- 상단 패널 -->
  <div id="topPanel" class="relative">
    <div class="absolute inset-0 bg-gradient-to-b from-indigo-950 via-slate-950 to-slate-950"></div>

    <div class="relative max-w-4xl mx-auto px-4 pt-8 pb-6">
      <div class="rounded-3xl border borde-rwhite/10 bg-white/5 backdrop-blur-xl shadow-[0_20px_60px_rgba(0,0,0,0.45)] overflow-hidden">
        <div class="px-5 sm:px-8 pt-6 sm:pt-7 pb-6 sm:pb-7">

          <!-- 제목 -->
          <header class="text-center leading-tight">
            <div class="text-2xl sm:text-4xl font-extrabold">
              서울시 공동주택
            </div>
            <div class="mt-1 text-2xl sm:text-4xl font-extrabold">
              콘덴싱 보일러 설치 맵
            </div>
          </header>

          <div class="mt-3 text-center text-sm sm:text-base text-slate-300">
            ※ 주소 검색을 통해 콘덴싱 보일러 설치 여부 확인
          </div>

          <!-- 검색 -->
          <div class="mt-5 flex flex-col sm:flex-row gap-3">
            <input
              id="addr"
              class="w-full px-4 py-3 sm:py-4 text-base sm:text-lg font-semibold text-center rounded-2xl
                     bg-slate-900/60 border border-white/10 text-slate-100
                     placeholder:text-slate-400 outline-none
                     focus:ring-2 focus:ring-indigo-400/70"
              placeholder="주소를 입력하세요 (예: 국회대로76길22)"
            />
            <button
              onclick="searchAddress()"
              class="w-full sm:w-48 py-3 sm:py-4 text-base sm:text-lg font-bold rounded-2xl
                     bg-indigo-500 hover:bg-indigo-400 active:bg-indigo-600
                     text-slate-950">
              🔍 주소 검색
            </button>
          </div>

          <!-- 로딩 -->
          <div id="loadingBox"
               class="mt-4 px-4 py-3 text-sm rounded-2xl
                      border border-indigo-300/20 bg-indigo-500/10
                      text-indigo-100 hidden">
            조회 중입니다...
          </div>

          <!-- 에러 -->
          <div id="errorBox"
               class="mt-4 px-4 py-3 text-sm rounded-2xl
                      border border-rose-400/40 bg-rose-500/10
                      text-rose-200 hidden"></div>

          <!-- 결과 -->
          <div id="resultBox"
               class="mt-4 rounded-2xl border border-white/10
                      bg-slate-900/40 overflow-hidden hidden">

            <div class="grid grid-cols-12 gap-3 px-4 py-3 bg-white/5
                        text-xs sm:text-sm font-semibold text-slate-300">
              <div class="col-span-10">검색 결과</div>
              <div class="col-span-2 text-right">선택</div>
            </div>

            <div id="resultList"></div>
          </div>

          <!-- 정보(우편번호/지번/도로명 + 설치여부) -->
          <div id="infoBox"
               class="mt-4 px-5 py-4 rounded-2xl hidden"></div>

        </div>
      </div>
    </div>
  </div>

  <!-- 지도 영역 -->
  <div class="max-w-6xl mx-auto px-4 pb-10">

    <div class="mb-4 text-center px-2">
      <div class="text-xs sm:text-sm font-semibold text-slate-400
                  whitespace-normal break-keep leading-relaxed">
        ※ 아래 지도는 참고용입니다.
      </div>
      <div class="text-[11px] sm:text-xs text-slate-500
                  whitespace-normal break-keep leading-relaxed">
        (마커는 선택한 주소 기준으로 표시됩니다)
      </div>
    </div>

    <div class="rounded-3xl border border-white/10 bg-white/5
                backdrop-blur shadow-[0_20px_60px_rgba(0,0,0,0.45)]
                overflow-hidden">
      <div id="map" class="w-full h-[62vh]"></div>
    </div>
  </div>

  <!-- Kakao Map SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=485d2de99e1aa2076405dfb51411b5d7&libraries=services&autoload=false"></script>

  <script>
    /**********************************************************************
     * ✅ 1) 여기 2개만 너 Supabase 값으로 바꿔줘
     **********************************************************************/
    const SUPABASE_URL = "https://ejiocupbmoyqziaziiya.supabase.co"; // ← 너 프로젝트 URL
    const SUPABASE_ANON_KEY = "sb_publishable_vRdnw-7IoqBST-wvBCV6eA_2635Pdvx"; // ← anon public key

    /**********************************************************************
     * ✅ 2) 주소 키 정규화(엑셀/DB 만들 때랑 규칙을 맞추는 게 핵심)
     *    - 최소 정규화: 괄호 제거, 공백 정리
     **********************************************************************/
    function normalizeAddr(s) {
      if (!s) return "";
      return String(s)
        .replace(/\(.*?\)/g, "")      // 괄호 제거
        .replace(/[\t\r\n]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    /**********************************************************************
     * ✅ 3) Supabase에서 addr_key로 result 가져오기
     *    - 테이블: addr_map
     *    - 컬럼: addr_key (PK), result
     **********************************************************************/
    const heatCache = new Map(); // 동일 주소 재조회 방지(속도/트래픽 절약)

    async function fetchHeatFromSupabase(addr) {
      const key = normalizeAddr(addr);
      if (!key) return "정보없음";

      if (heatCache.has(key)) return heatCache.get(key);

      const url =
        `${SUPABASE_URL}/rest/v1/addr_map` +
        `?addr_key=eq.${encodeURIComponent(key)}` +
        `&select=result` +
        `&limit=1`;

      try {
        const res = await fetch(url, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Accept": "application/json"
          }
        });

        if (!res.ok) {
          console.error("Supabase fetch failed:", res.status, await res.text());
          heatCache.set(key, "정보없음");
          return "정보없음";
        }

        const data = await res.json();
        const result = (Array.isArray(data) && data.length > 0 && data[0].result)
          ? data[0].result
          : "정보없음";

        heatCache.set(key, result);
        return result;
      } catch (e) {
        console.error("Supabase error:", e);
        heatCache.set(key, "정보없음");
        return "정보없음";
      }
    }

    kakao.maps.load(function () {

      const map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(36.3, 127.9),
        level: 11,
      });

      const geocoder = new kakao.maps.services.Geocoder();
      const places = new kakao.maps.services.Places();
      let markers = [];

      // 좌표->주소(우편번호 포함) 캐시: 같은 좌표 재조회 방지
      const coordCache = new Map(); // key: "x,y" => {zip, road, jibun}

      function setHidden(id, hidden) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.toggle("hidden", hidden);
      }

      function showError(msg) {
        const box = document.getElementById("errorBox");
        box.textContent = msg;
        setHidden("errorBox", false);
      }

      function clearError() {
        setHidden("errorBox", true);
        document.getElementById("errorBox").textContent = "";
      }

      function clearMarkers() {
        markers.forEach(m => m.setMap(null));
        markers = [];
      }

      // ✅ (핵심) 검색 결과 r에서 지번/도로명/우편번호/좌표 뽑기
      function pickAddr(r) {
        var jibun = "";

        if(r.address != null){
          jibun = r.address.address_name;
        };
        
          //r.address_name ||
          //(r.address && r.address.address_name) ||
          //"";

        const road = r.road_address.address_name;
          //r.road_address_name ||
          //(r.road_address && r.road_address.address_name) ||
          //"";

        const zip =
          (r.road_address && r.road_address.zone_no) ||
          (r.address && r.address.zip_code) ||
          "";

        const x = Number(r.x);
        const y = Number(r.y);

        return { jibun, road, zip, x, y, raw: r };
      }

      // ✅ 좌표로 우편번호/도로명/지번 보강 (places 결과는 zip이 비어있는 경우가 많음)
      function coord2FullAddress(x, y) {
        return new Promise((resolve) => {
          if (!x || !y) return resolve({ zip: "", road: "", jibun: "" });

          const key = `${x},${y}`;
          if (coordCache.has(key)) return resolve(coordCache.get(key));

          geocoder.coord2Address(x, y, function (res, status) {
            if (status !== kakao.maps.services.Status.OK || !res || !res[0]) {
              const empty = { zip: "", road: "", jibun: "" };
              coordCache.set(key, empty);
              return resolve(empty);
            }
            const a = res[0];
            const out = {
              zip: (a.road_address && a.road_address.zone_no) || "",
              road: (a.road_address && a.road_address.address_name) || "",
              jibun: (a.address && a.address.address_name) || "",
            };
            coordCache.set(key, out);
            resolve(out);
          });
        });
      }

      // ✅ 목록에 우편번호/지번/도로명처럼 보이게 렌더링
      function renderResult(result) {
        const box = document.getElementById("resultBox");
        const list = document.getElementById("resultList");
        list.innerHTML = "";
        setHidden("infoBox", true);
        box.classList.remove("hidden");

        result.forEach(r => {
          const a = pickAddr(r);

          const zipText = a.zip ? a.zip : "우편번호(선택 시 확인)";
          const jibunText = a.jibun ? a.jibun : (r.place_name ? r.place_name : "-");
          const roadText = a.road ? a.road : "-";

          const row = document.createElement("div");
          row.className =
            "grid grid-cols-12 gap-3 px-4 py-3 border-t border-white/5 hover:bg-white/5";

          row.innerHTML = `
            <div class="col-span-10 min-w-0 cursor-pointer">
              <div class="text-sm sm:text-base font-extrabold text-slate-200">
                ${zipText}
              </div>
              <div class="mt-1 text-xs sm:text-sm text-slate-200 break-keep">
                (지번) ${jibunText}
              </div>
              <div class="mt-1 text-xs sm:text-sm text-slate-400 break-keep">
                (도로명) ${roadText}
              </div>
            </div>
            <div class="col-span-2 text-right">
              <button class="px-3 py-1.5 text-xs font-bold rounded-xl
                             bg-indigo-500 hover:bg-indigo-400 text-slate-950">
                선택
              </button>
            </div>
          `;

          row.querySelector("button").onclick = (e) => {
            e.stopPropagation();
            selectAddress(r);
          };
          row.querySelector(".col-span-10").onclick = () => selectAddress(r);

          list.appendChild(row);
        });
      }

      // ✅ 검색 버튼
      window.searchAddress = function () {
        clearError();
        setHidden("loadingBox", true);
        setHidden("resultBox", true);
        setHidden("infoBox", true);

        const keyword = document.getElementById("addr").value.trim();
        if (!keyword) {
          alert("주소를 입력하세요!");
          return;
        }

        // 1) 주소 검색(도로명/지번 정확 주소)
        geocoder.addressSearch(keyword, function (result, status) {
          if (status === kakao.maps.services.Status.OK && Array.isArray(result) && result.length > 0) {
            renderResult(result);
          } else {
            // 2) 키워드 검색(건물명/장소명)
            places.keywordSearch(keyword, function (res, stat) {
              if (stat === kakao.maps.services.Status.OK && Array.isArray(res) && res.length > 0) {
                renderResult(res);
              } else {
                showError("주소 검색이 실패했습니다. 다시 확인해주세요.");
              }
            });
          }
        });
      };

      // ✅ 선택 -> 우편번호 포함 최종 주소 보강 -> Supabase 조회 -> 표시
      async function selectAddress(r) {
        clearError();
        setHidden("loadingBox", false);
        setHidden("resultBox", true);

        const picked = pickAddr(r);

        // 좌표가 없는 케이스 대비
        if (!picked.x || !picked.y) {
          setHidden("loadingBox", true);
          showError("좌표 정보를 가져오지 못했습니다. 다른 검색 결과를 선택해 주세요.");
          return;
        }

        // 우편번호/도로명/지번 보강
        const full = await coord2FullAddress(picked.x, picked.y);

        const finalZip = picked.zip || full.zip || "";
        const finalRoad = picked.road || full.road || "";
        const finalJibun = picked.jibun || full.jibun || "";

        // ✅ DB 조회 키: 도로명 우선(원하면 finalJibun 우선으로 바꾸면 됨)
        const lookupAddr = finalZip;

        // Supabase 조회
        const heat = await fetchHeatFromSupabase(lookupAddr);

        // 정보 박스 표시
        const info = document.getElementById("infoBox");
        setHidden("loadingBox", true);
        setHidden("infoBox", false);

        info.className =
          "mt-4 px-5 py-4 rounded-2xl border " +
          (heat === "정보없음"
            ? "bg-amber-500/10 border-amber-400/20"
            : "bg-indigo-500/10 border-indigo-300/20");

        info.innerHTML = `
          <div class="text-slate-100">
            <div class="text-lg sm:text-2xl font-extrabold">
              ${finalZip ? finalZip : "우편번호 정보 없음"}
            </div>

            <div class="mt-3 text-xs sm:text-sm text-slate-200">
              <span class="font-bold">(지번)</span> ${finalJibun || "-"}
            </div>

            <div class="mt-1 text-xs sm:text-sm text-slate-400">
              <span class="font-bold text-slate-300">(도로명)</span> ${finalRoad || "-"}
            </div>

            <div class="mt-4 text-base sm:text-lg font-extrabold">
              ${
                heat === "정보없음"
                  ? `해당 지역은 <span class="text-amber-300">정보가 없는 지역</span>입니다.`
                  : `해당 지역은 <span class="underline text-red-400">${heat}</span> 설치지역입니다.`
              }
            </div>
          </div>
        `;

        // 지도 마커 표시
        clearMarkers();
        const pos = new kakao.maps.LatLng(picked.y, picked.x);
        const marker = new kakao.maps.Marker({ position: pos });
        marker.setMap(map);
        markers.push(marker);

        map.setCenter(pos);
        map.setLevel(5);
      }

    });
  </script>

</body>
</html>
