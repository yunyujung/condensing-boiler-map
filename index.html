<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울시 공동주택 콘덴싱 보일러 설치 맵</title>

  <!-- Tailwind CSS CDN -->
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: { sans: ['"맑은 고딕"', "system-ui", "sans-serif"] },
          },
        },
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-slate-950 font-sans text-slate-100">

  <!-- 상단 패널 -->
  <div id="topPanel" class="relative">
    <div class="absolute inset-0 bg-gradient-to-b from-indigo-950 via-slate-950 to-slate-950"></div>

    <div class="relative max-w-4xl mx-auto px-4 pt-8 pb-5">
      <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-[0_20px_60px_rgba(0,0,0,0.45)] overflow-hidden">
        <div class="px-5 sm:px-8 pt-6 sm:pt-7 pb-6 sm:pb-7">

          <!-- 제목 -->
          <header class="text-center leading-tight">
            <div class="text-2xl sm:text-4xl font-extrabold tracking-tight">서울시 공동주택</div>
            <div class="mt-1 text-2xl sm:text-4xl font-extrabold tracking-tight">콘덴싱 보일러 설치 맵</div>
          </header>

          <!-- 서브텍스트 -->
          <div class="mt-3 text-center text-sm sm:text-base text-slate-300">
            주소 검색을 통해 콘덴싱보일러 설치여부를 확인할 수 있습니다.
          </div>

          <!-- 검색 박스 -->
          <div id="searchBox" class="mt-5">
            <div class="flex flex-col sm:flex-row gap-3">
              <input
                id="addr"
                class="w-full px-4 py-3 sm:py-4 text-base sm:text-lg font-semibold text-center rounded-2xl
                       bg-slate-900/60 border border-white/10 text-slate-100 placeholder:text-slate-400
                       outline-none focus:ring-2 focus:ring-indigo-400/70 focus:border-indigo-300/70"
                placeholder="주소를 입력하세요 (예: 국회대로76길22)"
              />
              <button
                id="searchBtn"
                class="w-full sm:w-48 py-3 sm:py-4 text-base sm:text-lg font-bold rounded-2xl
                       bg-indigo-500 hover:bg-indigo-400 active:bg-indigo-600
                       text-slate-950 transition-colors shadow-lg shadow-indigo-500/20">
                🔍 주소 검색
              </button>
            </div>

            <!-- 힌트 배지 -->
            <div class="mt-3 flex flex-wrap justify-center gap-2 text-xs sm:text-sm">
              <span class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-slate-300">
                도로명 + 건물번호 입력
              </span>
              <span class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-slate-300">
                동/읍/면/리 +번지 입력
              </span>
            </div>
          </div>

          <!-- 에러 메시지 -->
          <div
            id="errorBox"
            class="mt-4 px-4 py-3 text-sm sm:text-base rounded-2xl border border-rose-400/40 bg-rose-500/10 text-rose-200 hidden">
          </div>

          <!-- 검색 결과 리스트 -->
          <div
            id="resultBox"
            class="mt-4 rounded-2xl border border-white/10 bg-slate-900/40 overflow-hidden hidden">

            <!-- ✅ 우편번호 숨김: 헤더도 '주소/선택'만 -->
            <div id="resultHeader"
              class="flex items-center justify-between px-4 py-3 bg-white/5 text-xs sm:text-sm font-semibold text-slate-300">
              <span>주소</span>
              <span>선택</span>
            </div>

            <div id="resultList"></div>
          </div>

          <!-- 안내 박스 -->
          <div
            id="infoBox"
            class="mt-4 px-5 py-4 text-lg sm:text-2xl font-extrabold rounded-2xl hidden">
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- 지도 영역 -->
  <div class="max-w-6xl mx-auto px-4 pb-8 -mt-2">
    <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-1 mb-2">
      <div class="min-w-0 text-xs sm:text-sm font-semibold text-slate-400 break-words">
        ※ 아래 지도는 참고용입니다
      </div>
      <div class="text-[11px] sm:text-xs text-slate-500 whitespace-nowrap">
        (마커는 선택한 주소 기준으로 표시됩니다)
      </div>
    </div>

    <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur shadow-[0_20px_60px_rgba(0,0,0,0.45)] overflow-hidden">
      <div id="map" class="w-full h-[62vh]"></div>
    </div>
  </div>

  <!-- Kakao Map SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=485d2de99e1aa2076405dfb51411b5d7&libraries=services&autoload=false"></script>

  <script>
    // =========================
    // 안전한 초기화 + 에러 방지
    // =========================
    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.classList.remove("hidden");
      box.textContent = msg;
    }
    function hideError() {
      document.getElementById("errorBox").classList.add("hidden");
    }

    function normalizeText(t) {
      if (!t) return "";
      return t
        .toString()
        .trim()
        .replace(/\s+/g, "")
        .replace(/-/g, "")
        .replace(/[^\uAC00-\uD7A3a-zA-Z0-9]/g, "")
        .toLowerCase();
    }

    // ✅ 결과(주소검색/키워드검색) 객체 형태가 달라도 안전하게 주소 문자열 뽑기
    function safeFullAddress(r) {
      // addressSearch 결과
      if (r && r.road_address && r.road_address.address_name) return r.road_address.address_name;
      if (r && r.address_name) return r.address_name;
      if (r && r.address && r.address.address_name) return r.address.address_name;

      // keywordSearch(Places) 결과
      if (r && r.road_address_name) return r.road_address_name;
      if (r && r.address_name) return r.address_name;
      if (r && r.place_name) return r.place_name;

      return "주소 미확인";
    }

    // ✅ 건물명도 안전하게
    function safeBuildingLabel(r) {
      // addressSearch 결과
      if (r && r.road_address && r.road_address.building_name) return r.road_address.building_name;
      if (r && r.address && r.address.building_name) return r.address.building_name;
      if (r && r.address && r.address.bname) return r.address.bname;

      // keywordSearch 결과는 보통 건물명 별도 없음 → place_name 사용(원하면)
      // return r && r.place_name ? r.place_name : "-";
      return "-";
    }

    // ✅ 좌표도 안전하게(둘 다 x,y는 있음. 혹시 없을 때 대비)
    function safeLatLng(r) {
      const y = (r && r.y != null) ? parseFloat(r.y) : null;
      const x = (r && r.x != null) ? parseFloat(r.x) : null;
      if (Number.isFinite(x) && Number.isFinite(y)) return { x, y };
      return null;
    }

    function extractBuildingKey(r) {
      const name = safeBuildingLabel(r);
      return normalizeText(name === "-" ? "" : name);
    }

    function getAccentClass(type) {
      if (type === "콘덴싱보일러") return "text-emerald-300";
      if (type === "일반형보일러") return "text-rose-300";
      if (type === "중앙난방") return "text-slate-300";
      if (type === "지역난방") return "text-slate-300";
      return "text-amber-300";
    }

    // =========================
    // Kakao init
    // =========================
    kakao.maps.load(function () {
      hideError();

      // 지도 생성
      const map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(36.3, 127.9),
        level: 11,
      });

      const geocoder = new kakao.maps.services.Geocoder();
      const places = new kakao.maps.services.Places();

      let currentOverlays = [];
      let allPoints = [];

      // 🔹 예시 DB
      const heatAddrDB = {
        "헬리오시티": "지역난방",
        "래미안퍼스티지": "지역난방",
        "국회대로76길22": "콘덴싱보일러"
      };

      function clearOverlays() {
        currentOverlays.forEach((o) => o.setMap(null));
        currentOverlays = [];
      }

      function showInfo(heatType) {
        const info = document.getElementById("infoBox");
        info.classList.remove("hidden");

        if (heatType === "정보없음") {
          info.className =
            "mt-4 px-5 py-4 text-lg sm:text-2xl font-extrabold rounded-2xl " +
            "bg-amber-500/10 border border-amber-400/20 text-slate-100";
          info.innerHTML =
            `해당 지역은 <span class="text-amber-300 underline underline-offset-4">정보가 없는 지역</span>입니다.`;
        } else {
          const accent = getAccentClass(heatType);
          info.className =
            "mt-4 px-5 py-4 text-lg sm:text-2xl font-extrabold rounded-2xl " +
            "bg-indigo-500/10 border border-indigo-300/20 text-slate-100";
          info.innerHTML =
            `해당 지역은 <span class="${accent} underline underline-offset-4">${heatType}</span> 설치지역입니다.`;
        }
      }

      function showResult(result) {
        const box = document.getElementById("resultBox");
        const list = document.getElementById("resultList");
        list.innerHTML = "";
        box.classList.remove("hidden");
        document.getElementById("infoBox").classList.add("hidden");

        const used = new Set();

        (result || []).forEach((r) => {
          const full = safeFullAddress(r);
          const building = safeBuildingLabel(r);

          // 중복 제거 키
          const dedupKey = full + "|" + building;
          if (used.has(dedupKey)) return;
          used.add(dedupKey);

          const row = document.createElement("div");
          row.className =
            "flex items-start justify-between gap-3 px-4 py-3 border-t border-white/5 " +
            "hover:bg-white/5 transition-colors";

          // ✅ 주소 안 짤리게: truncate 제거 + 줄바꿈 허용
          row.innerHTML = `
            <div class="min-w-0 flex-1 cursor-pointer">
              <div class="font-semibold text-slate-100 text-sm sm:text-base whitespace-normal break-words">
                ${full}
              </div>
              <div class="mt-1 text-xs sm:text-sm text-slate-400 whitespace-normal break-words">
                ${building !== "-" ? "🏢 " + building : ""}
              </div>
            </div>

            <div class="shrink-0 self-start">
              <button
                type="button"
                class="whitespace-nowrap h-fit px-5 py-2 text-xs sm:text-sm font-extrabold rounded-xl
                       bg-indigo-500 hover:bg-indigo-400 active:bg-indigo-600
                       text-slate-950 transition-colors shadow shadow-indigo-500/20">
                선택
              </button>
            </div>
          `;

          // 좌측 클릭 선택
          row.children[0].onclick = function () { selectAddress(r); };

          // 버튼 클릭 선택
          row.querySelector("button").onclick = function (e) {
            e.stopPropagation();
            selectAddress(r);
          };

          list.appendChild(row);
        });
      }

      function selectAddress(r) {
        document.getElementById("resultBox").classList.add("hidden");

        const address = safeFullAddress(r);
        const key1 = normalizeText(address);
        const key2 = extractBuildingKey(r);

        const heatType =
          heatAddrDB[key1] ||
          heatAddrDB[key2] ||
          "정보없음";

        showInfo(heatType);

        const xy = safeLatLng(r);
        if (!xy) {
          showError("좌표 정보를 가져오지 못했습니다. 다른 주소를 선택해 주세요.");
          return;
        }

        const coords = new kakao.maps.LatLng(xy.y, xy.x);
        map.setCenter(coords);
        map.setLevel(5);

        if (heatType !== "정보없음") {
          allPoints.push({ lat: xy.y, lng: xy.x, type: heatType });
        }

        clearOverlays();
        const marker = new kakao.maps.Marker({ position: coords });
        marker.setMap(map);
        currentOverlays.push(marker);
      }

      // 검색 실행(주소검색 -> 실패시 키워드검색)
      function runSearch() {
        hideError();

        const keyword = document.getElementById("addr").value.trim();
        if (!keyword) {
          alert("주소를 입력하세요!");
          return;
        }

        geocoder.addressSearch(keyword, function (result, status) {
          if (status === kakao.maps.services.Status.OK && result && result.length) {
            showResult(result);
            return;
          }

          // 도로명 검색 안되면 키워드 검색
          places.keywordSearch(keyword, function (res, stat) {
            if (stat === kakao.maps.services.Status.OK && res && res.length) {
              showResult(res);
            } else {
              showError("주소 검색이 실패했습니다. (주소/건물명/지번을 다시 확인해주세요)");
            }
          });
        });
      }

      // 버튼/엔터키 바인딩
      document.getElementById("searchBtn").addEventListener("click", runSearch);
      document.getElementById("addr").addEventListener("keydown", function (e) {
        if (e.key === "Enter") runSearch();
      });

      // (안전 처리 유지)
      window.filterType = function () {
        alert("필터 버튼은 UI에서 제거되었습니다.");
      };
    });
  </script>

</body>
</html>
