<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울시 공동주택 콘덴싱 보일러 설치 맵</title>

  <!-- Tailwind CSS CDN -->
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"맑은 고딕"', "system-ui", "sans-serif"],
            },
          },
        },
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-slate-950 font-sans text-slate-100">

  <!-- 상단 패널 -->
  <div id="topPanel" class="relative">
    <div class="absolute inset-0 bg-gradient-to-b from-indigo-950 via-slate-950 to-slate-950"></div>

    <div class="relative max-w-4xl mx-auto px-4 pt-8 pb-6">
      <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-[0_20px_60px_rgba(0,0,0,0.45)] overflow-hidden">
        <div class="px-5 sm:px-8 pt-6 sm:pt-7 pb-6 sm:pb-7">

          <!-- 제목 -->
          <header class="text-center leading-tight">
            <div class="text-2xl sm:text-4xl font-extrabold">
              서울시 공동주택
            </div>
            <div class="mt-1 text-2xl sm:text-4xl font-extrabold">
              콘덴싱 보일러 설치 맵
            </div>
          </header>

          <div class="mt-3 text-center text-sm sm:text-base text-slate-300">
            ※ 주소 검색을 통해 콘덴싱 보일러 설치 여부 확인
          </div>

          <!-- 검색 -->
          <div class="mt-5 flex flex-col sm:flex-row gap-3">
            <input
              id="addr"
              class="w-full px-4 py-3 sm:py-4 text-base sm:text-lg font-semibold text-center rounded-2xl
                     bg-slate-900/60 border border-white/10 text-slate-100
                     placeholder:text-slate-400 outline-none
                     focus:ring-2 focus:ring-indigo-400/70"
              placeholder="주소를 입력하세요 (예: 국회대로76길22)"
            />
            <button
              onclick="searchAddress()"
              class="w-full sm:w-48 py-3 sm:py-4 text-base sm:text-lg font-bold rounded-2xl
                     bg-indigo-500 hover:bg-indigo-400 active:bg-indigo-600
                     text-slate-950">
              🔍 주소 검색
            </button>
          </div>

          <!-- 에러 -->
          <div id="errorBox"
               class="mt-4 px-4 py-3 text-sm rounded-2xl
                      border border-rose-400/40 bg-rose-500/10
                      text-rose-200 hidden"></div>

          <!-- 결과 -->
          <div id="resultBox"
               class="mt-4 rounded-2xl border border-white/10
                      bg-slate-900/40 overflow-hidden hidden">

            <div class="grid grid-cols-10 gap-3 px-4 py-3 bg-white/5
                        text-xs sm:text-sm font-semibold text-slate-300">
              <div class="col-span-8">주소</div>
              <div class="col-span-2 text-right">선택</div>
            </div>

            <div id="resultList"></div>
          </div>

          <!-- 난방유형 -->
          <div id="infoBox"
               class="mt-4 px-5 py-4 text-lg sm:text-2xl
                      font-extrabold rounded-2xl hidden"></div>

        </div>
      </div>
    </div>
  </div>

  <!-- 지도 영역 -->
  <div class="max-w-6xl mx-auto px-4 pb-10">

    <div class="mb-4 text-center px-2">
      <div class="text-xs sm:text-sm font-semibold text-slate-400
                  whitespace-normal break-keep leading-relaxed">
        ※ 아래 지도는 참고용입니다.
      </div>
      <div class="text-[11px] sm:text-xs text-slate-500
                  whitespace-normal break-keep leading-relaxed">
        (마커는 선택한 주소 기준으로 표시됩니다)
      </div>
    </div>

    <div class="rounded-3xl border border-white/10 bg-white/5
                backdrop-blur shadow-[0_20px_60px_rgba(0,0,0,0.45)]
                overflow-hidden">
      <div id="map" class="w-full h-[62vh]"></div>
    </div>
  </div>

  <!-- Kakao Map SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=485d2de99e1aa2076405dfb51411b5d7&libraries=services&autoload=false"></script>

  <script>
    /**********************************************************************
     * ✅ Supabase 설정 (너 프로젝트 값)
     **********************************************************************/
    const SUPABASE_URL = "https://ejiocupbmoyqziaziiya.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_vRdnw-7IoqBST-wvBCV6eA_2635Pdvx";

    /**********************************************************************
     * ✅ 주소 정규화 (괄호 제거 / 공백 정리)
     **********************************************************************/
    function normalizeAddr(s) {
      if (!s) return "";
      return String(s)
        .replace(/\(.*?\)/g, "")
        .replace(/[\t\r\n]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    /**********************************************************************
     * ✅ 카카오 검색 결과에서 "지번주소/도로명주소" 후보를 만들고,
     *    "서울특별시/서울시/서울" 표기 흔들림을 모두 커버
     **********************************************************************/
    function buildKeyCandidatesFromKakao(r) {
      const cands = [];

      // 지번(동/번지) 주소: r.address.address_name
      if (r.address && r.address.address_name) cands.push(r.address.address_name);

      // 도로명 주소: r.road_address.address_name
      if (r.road_address && r.road_address.address_name) cands.push(r.road_address.address_name);

      // fallback: r.address_name
      if (r.address_name) cands.push(r.address_name);

      const norm = cands.map(normalizeAddr).filter(Boolean);
      return [...new Set(norm)];
    }

    function expandSeoulVariants(key) {
      const v = [key];

      if (key.startsWith("서울특별시 ")) {
        v.push(key.replace(/^서울특별시\s+/, "서울 "));
        v.push(key.replace(/^서울특별시\s+/, "서울시 "));
      }
      if (key.startsWith("서울시 ")) {
        v.push(key.replace(/^서울시\s+/, "서울 "));
        v.push(key.replace(/^서울시\s+/, "서울특별시 "));
      }
      if (key.startsWith("서울 ")) {
        v.push(key.replace(/^서울\s+/, "서울특별시 "));
        v.push(key.replace(/^서울\s+/, "서울시 "));
      }

      return [...new Set(v.map(normalizeAddr).filter(Boolean))];
    }

    /**********************************************************************
     * ✅ Supabase 조회: addr_key가 존재하면 "콘덴싱보일러"
     *    - 테이블: addr_map
     *    - 컬럼: addr_key
     **********************************************************************/
    const heatCache = new Map(); // 성공만 캐시

    async function existsInDb(key) {
      const url =
        `${SUPABASE_URL}/rest/v1/addr_map` +
        `?addr_key=eq.${encodeURIComponent(key)}` +
        `&select=addr_key` +
        `&limit=1`;

      const res = await fetch(url, {
        method: "GET",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Accept": "application/json"
        }
      });

      // res.json()에서 터지는 경우가 있어서 text -> JSON.parse로 안전하게 처리
      const text = await res.text();
      if (!res.ok) {
        console.error("Supabase error:", res.status, text);
        return false;
      }

      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        console.error("Supabase JSON parse error:", e, text);
        return false;
      }

      return Array.isArray(data) && data.length > 0;
    }

    async function fetchHeatFromSupabaseByKakaoResult(r) {
      const baseKeys = buildKeyCandidatesFromKakao(r);
      if (baseKeys.length === 0) return "정보없음";

      for (const base of baseKeys) {
        const variants = expandSeoulVariants(base);

        for (const key of variants) {
          if (heatCache.has(key)) return heatCache.get(key);

          const ok = await existsInDb(key);
          if (ok) {
            heatCache.set(key, "콘덴싱보일러");
            return "콘덴싱보일러";
          }
        }
      }

      return "정보없음";
    }

    kakao.maps.load(function () {

      const map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(36.3, 127.9),
        level: 11,
      });

      const geocoder = new kakao.maps.services.Geocoder();
      const places = new kakao.maps.services.Places();
      let markers = [];

      function clearMarkers() {
        markers.forEach(m => m.setMap(null));
        markers = [];
      }

      window.searchAddress = function () {
        document.getElementById("errorBox").classList.add("hidden");

        const keyword = document.getElementById("addr").value.trim();
        if (!keyword) {
          alert("주소를 입력하세요!");
          return;
        }

        geocoder.addressSearch(keyword, function (result, status) {
          if (status === kakao.maps.services.Status.OK) {
            renderResult(result);
          } else {
            places.keywordSearch(keyword, function (res, stat) {
              if (stat === kakao.maps.services.Status.OK) {
                renderResult(res);
              } else {
                document.getElementById("errorBox").textContent =
                  "주소 검색이 실패했습니다. 다시 확인해주세요.";
                document.getElementById("errorBox").classList.remove("hidden");
              }
            });
          }
        });
      };

      function renderResult(result) {
        const box = document.getElementById("resultBox");
        const list = document.getElementById("resultList");
        list.innerHTML = "";
        box.classList.remove("hidden");

        result.forEach(r => {
          const row = document.createElement("div");
          row.className =
            "grid grid-cols-10 gap-3 px-4 py-3 border-t border-white/5 hover:bg-white/5";

          row.innerHTML = `
            <div class="col-span-8 text-sm sm:text-base cursor-pointer">
              ${r.address_name || r.place_name}
            </div>
            <div class="col-span-2 text-right">
              <button class="px-3 py-1.5 text-xs font-bold rounded-xl
                             bg-indigo-500 hover:bg-indigo-400 text-slate-950">
                선택
              </button>
            </div>
          `;

          row.querySelector("button").onclick = () => selectAddress(r);
          row.children[0].onclick = () => selectAddress(r);

          list.appendChild(row);
        });
      }

      async function selectAddress(r) {
        document.getElementById("resultBox").classList.add("hidden");

        // ✅ 카카오 결과 r를 그대로 넘겨서 (지번/도로명/서울표기 변형까지) 조회
        const heat = await fetchHeatFromSupabaseByKakaoResult(r);

        const info = document.getElementById("infoBox");
        info.classList.remove("hidden");

        info.className =
          "mt-4 px-5 py-4 text-lg sm:text-2xl font-extrabold rounded-2xl " +
          (heat === "정보없음"
            ? "bg-amber-500/10 border border-amber-400/20"
            : "bg-indigo-500/10 border border-indigo-300/20");

        info.innerHTML =
          heat === "정보없음"
            ? `해당 지역은 <span class="text-amber-300">정보가 없는 지역</span>입니다.`
            : `해당 지역은 <span class="underline">콘덴싱보일러</span> 설치지역입니다.`;

        // 지도 마커
        clearMarkers();
        const pos = new kakao.maps.LatLng(r.y, r.x);
        const marker = new kakao.maps.Marker({ position: pos });
        marker.setMap(map);
        markers.push(marker);

        map.setCenter(pos);
        map.setLevel(5);
      }

    });
  </script>

</body>
</html>
