<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울시 공동주택 콘덴싱 보일러 설치 맵</title>

  <!-- Tailwind CSS CDN -->
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"맑은 고딕"', "system-ui", "sans-serif"],
            },
          },
        },
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-slate-950 font-sans text-slate-100">

  <!-- 상단 패널 -->
  <div id="topPanel" class="relative">
    <!-- 배경 그라데이션 -->
    <div class="absolute inset-0 bg-gradient-to-b from-indigo-950 via-slate-950 to-slate-950"></div>

    <div class="relative max-w-4xl mx-auto px-4 pt-8 pb-5">
      <!-- 헤더 카드 -->
      <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-[0_20px_60px_rgba(0,0,0,0.45)] overflow-hidden">
        <div class="px-5 sm:px-8 pt-6 sm:pt-7 pb-6 sm:pb-7">

          <!-- 제목 -->
          <header class="text-2xl sm:text-4xl font-extrabold tracking-tight text-center">
            서울시 공동주택 콘덴싱 보일러 설치 맵
          </header>

          <!-- 서브텍스트 (요청 문구 변경) -->
          <div class="mt-2 text-center text-sm sm:text-base text-slate-300">
            주소를 검색하시면 콘덴싱 설치 여부를 확인할 수 있습니다.
          </div>

          <!-- 검색 박스 -->
          <div id="searchBox" class="mt-5">
            <div class="flex flex-col sm:flex-row gap-3">
              <input
                id="addr"
                class="w-full px-4 py-3 sm:py-4 text-base sm:text-lg font-semibold text-center rounded-2xl
                       bg-slate-900/60 border border-white/10 text-slate-100 placeholder:text-slate-400
                       outline-none focus:ring-2 focus:ring-indigo-400/70 focus:border-indigo-300/70"
                placeholder="주소를 입력하세요 (예: 국회대로76길22)"
              />
              <button
                onclick="searchAddress()"
                class="w-full sm:w-48 py-3 sm:py-4 text-base sm:text-lg font-bold rounded-2xl
                       bg-indigo-500 hover:bg-indigo-400 active:bg-indigo-600
                       text-slate-950 transition-colors shadow-lg shadow-indigo-500/20">
                🔍 주소 검색
              </button>
            </div>

            <!-- 클릭 유도 아이콘 (문구 대신) -->
            <div class="mt-3 flex justify-center gap-2 text-xs text-slate-400">
              <span class="px-2 py-1 rounded-full bg-white/5 border border-white/10" title="아래 목록 확인">👇</span>
              <span class="px-2 py-1 rounded-full bg-white/5 border border-white/10" title="클릭하여 선택">🖱️</span>
              <span class="px-2 py-1 rounded-full bg-white/5 border border-white/10" title="항목을 눌러 선택">👉</span>
            </div>
          </div>

          <!-- 에러 메시지 -->
          <div
            id="errorBox"
            class="mt-4 px-4 py-3 text-sm sm:text-base rounded-2xl border border-rose-400/40 bg-rose-500/10 text-rose-200 hidden">
          </div>

          <!-- 검색 결과 리스트 -->
          <div
            id="resultBox"
            class="mt-4 rounded-2xl border border-white/10 bg-slate-900/40 overflow-hidden hidden">

            <div id="resultHeader"
              class="flex justify-between items-center px-4 py-3 bg-white/5 text-xs sm:text-sm font-semibold text-slate-300">
              <span>주소</span>
              <span class="flex items-center gap-2 text-slate-400 whitespace-nowrap">
                <span class="hidden sm:inline">우편번호</span>
                <span title="클릭하여 선택">🖱️</span>
              </span>
            </div>

            <div id="resultList"></div>
          </div>

          <!-- 콘덴싱 설치 여부 안내 -->
          <div
            id="infoBox"
            class="mt-4 px-5 py-4 text-lg sm:text-2xl font-extrabold rounded-2xl hidden">
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- 지도 영역 -->
  <div class="max-w-6xl mx-auto px-4 pb-8 -mt-2">
    <div class="flex items-center justify-between mb-2">
      <div class="text-xs sm:text-sm font-semibold text-slate-400">
        ※ 아래 지도는 참고용입니다
      </div>
      <div class="text-[11px] sm:text-xs text-slate-500">
        (마커는 선택한 주소 기준으로 표시됩니다)
      </div>
    </div>

    <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur shadow-[0_20px_60px_rgba(0,0,0,0.45)] overflow-hidden">
      <div id="map" class="w-full h-[62vh]"></div>
    </div>
  </div>

  <!-- Kakao Map SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=485d2de99e1aa2076405dfb51411b5d7&libraries=services&autoload=false"></script>

  <script>
    kakao.maps.load(function () {

      const map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(36.3, 127.9),
        level: 11,
      });

      const geocoder = new kakao.maps.services.Geocoder();
      const places = new kakao.maps.services.Places();

      let currentOverlays = [];
      let allPoints = [];

      // 🔹 DB 예시
      const heatAddrDB = {
        "헬리오시티": "지역난방",
        "래미안퍼스티지": "지역난방",
        "국회대로76길22": "콘덴싱보일러"
      };

      function normalizeText(t) {
        if (!t) return "";
        return t.toString().trim()
          .replace(/\s+/g, "")
          .replace(/-/g, "")
          .replace(/[^\uAC00-\uD7A3a-zA-Z0-9]/g, "")
          .toLowerCase();
      }

      function extractBuildingNameFromResult(r) {
        let name = "";
        if (r.road_address && r.road_address.building_name) name = r.road_address.building_name;
        else if (r.address && r.address.building_name) name = r.address.building_name;
        else if (r.address && r.address.bname) name = r.address.bname;
        return normalizeText(name);
      }

      function showError(msg) {
        const box = document.getElementById("errorBox");
        box.classList.remove("hidden");
        box.textContent = msg;
      }

      function clearOverlays() {
        currentOverlays.forEach((o) => o.setMap(null));
        currentOverlays = [];
      }

      window.searchAddress = function () {
        document.getElementById("errorBox").classList.add("hidden");

        const keyword = document.getElementById("addr").value.trim();
        if (!keyword) {
          alert("주소를 입력하세요!");
          return;
        }

        geocoder.addressSearch(keyword, function (result, status) {
          if (status === kakao.maps.services.Status.OK) {
            showResult(result);
            return;
          }

          places.keywordSearch(keyword, function (res, stat) {
            if (stat === kakao.maps.services.Status.OK) {
              showResult(res);
            } else {
              showError("주소 검색이 실패했습니다. (주소/건물명/지번을 다시 확인해주세요)");
            }
          });
        });
      };

      function getZip(r) {
        return (r.road_address && r.road_address.zone_no) ? r.road_address.zone_no :
               (r.zone_no) ? r.zone_no :
               (r.address && r.address.zip_code) ? r.address.zip_code :
               "미확인";
      }

      function showResult(result) {
        const box  = document.getElementById("resultBox");
        const list = document.getElementById("resultList");

        list.innerHTML = "";
        box.classList.remove("hidden");
        document.getElementById("infoBox").classList.add("hidden");

        const used = new Set();

        result.forEach((r) => {
          const full =
            r.road_address ? r.road_address.address_name :
            r.address_name ? r.address_name :
            r.address ? r.address.address_name :
            r.place_name || "주소 미확인";

          const building =
            (r.road_address && r.road_address.building_name) ? r.road_address.building_name :
            (r.address && r.address.building_name) ? r.address.building_name :
            (r.address && r.address.bname) ? r.address.bname :
            "-";

          const zip = getZip(r);

          if (used.has(full)) return;
          used.add(full);

          const row = document.createElement("div");
          row.className =
            "flex items-start gap-3 px-4 py-3 border-t border-white/5 cursor-pointer " +
            "hover:bg-white/5 active:bg-white/10 transition-colors";

          // ✅ 핵심: 우편번호가 아래로 안 짤리도록
          // - 오른쪽 영역을 shrink-0 + whitespace-nowrap로 고정
          // - 왼쪽(주소)은 flex-1로 두고 줄바꿈 허용
          row.innerHTML = `
            <div class="flex-1 min-w-0">
              <div class="flex items-start gap-2">
                <div class="pt-0.5 text-slate-400" aria-hidden="true">👉</div>
                <div class="min-w-0">
                  <div class="font-semibold text-slate-100 text-sm sm:text-base break-words">
                    ${full}
                  </div>
                  <div class="mt-1 text-xs sm:text-sm text-slate-400 break-words">
                    ${building !== "-" ? "🏢 " + building : ""}
                  </div>
                </div>
              </div>
            </div>

            <div class="shrink-0 whitespace-nowrap flex items-center gap-2">
              <span class="px-2 py-1 rounded-full bg-white/5 border border-white/10 text-xs sm:text-sm font-semibold text-slate-200">
                ${zip}
              </span>

              <!-- ✅ '선택' 버튼 작게 -->
              <button
                class="selectBtn px-2 py-1 rounded-full bg-indigo-500/20 border border-indigo-300/20
                       text-xs font-bold text-indigo-100 hover:bg-indigo-500/30 active:bg-indigo-500/40 transition-colors"
                type="button"
                title="이 주소 선택"
              >
                ✅ 선택
              </button>
            </div>
          `;

          // 행 클릭도 선택되게
          row.onclick = function () { selectAddress(r); };

          // 버튼 클릭도 선택되게 (행 클릭과 중복 방지)
          const btn = row.querySelector(".selectBtn");
          btn.onclick = function (e) {
            e.stopPropagation();
            selectAddress(r);
          };

          list.appendChild(row);
        });
      }

      window.selectAddress = function (r) {
        document.getElementById("resultBox").classList.add("hidden");

        const address =
          r.road_address ? r.road_address.address_name :
          r.address_name ? r.address_name :
          r.address ? r.address.address_name :
          "주소 정보 없음";

        const key1 = normalizeText(address);
        const key2 = extractBuildingNameFromResult(r);

        const heatType =
          heatAddrDB[key1] ||
          heatAddrDB[key2] ||
          "정보없음";

        const info = document.getElementById("infoBox");
        info.classList.remove("hidden");

        if (heatType === "정보없음") {
          info.className =
            "mt-4 px-5 py-4 text-lg sm:text-2xl font-extrabold rounded-2xl " +
            "bg-amber-500/10 border border-amber-400/20 text-slate-100";
          info.innerHTML =
            `해당 지역은 <span class="text-amber-300 underline underline-offset-4">정보가 없는 지역</span>입니다.`;
        } else if (heatType === "콘덴싱보일러") {
          info.className =
            "mt-4 px-5 py-4 text-lg sm:text-2xl font-extrabold rounded-2xl " +
            "bg-emerald-500/10 border border-emerald-300/20 text-slate-100";
          info.innerHTML =
            `해당 지역은 <span class="text-emerald-300 underline underline-offset-4">콘덴싱 설치 지역</span>입니다.`;
        } else {
          info.className =
            "mt-4 px-5 py-4 text-lg sm:text-2xl font-extrabold rounded-2xl " +
            "bg-indigo-500/10 border border-indigo-300/20 text-slate-100";
          info.innerHTML =
            `해당 지역은 <span class="text-slate-200 underline underline-offset-4">${heatType}</span> (콘덴싱 설치지역 정보 기준 아님)`;
        }

        const coords = new kakao.maps.LatLng(r.y, r.x);
        map.setCenter(coords);
        map.setLevel(5);

        if (heatType !== "정보없음") {
          allPoints.push({
            lat: parseFloat(r.y),
            lng: parseFloat(r.x),
            type: heatType
          });
        }

        clearOverlays();

        const marker = new kakao.maps.Marker({ position: coords });
        marker.setMap(map);
        currentOverlays.push(marker);
      };

    });
  </script>

</body>
</html>
