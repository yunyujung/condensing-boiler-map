<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울시 공동주택 콘덴싱 보일러 설치 맵</title>

  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"맑은 고딕"', "system-ui", "sans-serif"],
            },
          },
        },
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-slate-950 font-sans text-slate-100">

<!-- ================= 상단 UI ================= -->
<div class="relative">
  <div class="absolute inset-0 bg-gradient-to-b from-indigo-950 via-slate-950 to-slate-950"></div>

  <div class="relative max-w-4xl mx-auto px-4 pt-8 pb-6">
    <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur shadow-xl">
      <div class="px-5 sm:px-8 pt-6 pb-7">

        <header class="text-center">
          <div class="text-2xl sm:text-4xl font-extrabold">서울시 공동주택</div>
          <div class="mt-1 text-2xl sm:text-4xl font-extrabold">콘덴싱 보일러 설치 맵</div>
        </header>

        <div class="mt-3 text-center text-sm text-slate-300">
          ※ 주소 검색을 통해 콘덴싱 보일러 설치 여부 확인
        </div>

        <!-- 검색 -->
        <div class="mt-5 flex flex-col sm:flex-row gap-3">
          <input id="addr"
            class="w-full px-4 py-3 text-lg text-center font-semibold rounded-2xl
                   bg-slate-900/60 border border-white/10 text-slate-100
                   focus:ring-2 focus:ring-indigo-400"
            placeholder="주소를 입력하세요 (예: 국회대로76길22)" />
          <button onclick="searchAddress()"
            class="w-full sm:w-48 py-3 text-lg font-bold rounded-2xl
                   bg-indigo-500 hover:bg-indigo-400 text-slate-950">
            🔍 주소 검색
          </button>
        </div>

        <div id="loadingBox" class="mt-4 hidden text-indigo-200">조회 중...</div>
        <div id="errorBox" class="mt-4 hidden text-rose-300"></div>

        <div id="resultBox" class="mt-4 hidden rounded-2xl bg-slate-900/40 border border-white/10">
          <div id="resultList"></div>
        </div>

        <div id="infoBox" class="mt-4 hidden rounded-2xl"></div>

      </div>
    </div>
  </div>
</div>

<!-- ================= 지도 ================= -->
<div class="max-w-6xl mx-auto px-4 pb-10">
  <div class="rounded-3xl border border-white/10 bg-white/5 overflow-hidden">
    <div id="map" class="w-full h-[60vh]"></div>
  </div>
</div>

<!-- ================= Kakao Map ================= -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=485d2de99e1aa2076405dfb51411b5d7&libraries=services&autoload=false"></script>

<script>
/* ================= Supabase ================= */
const SUPABASE_URL = "https://ejiocupbmoyqziaziiya.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vRdnw-7IoqBST-wvBCV6eA_2635Pdvx";

/* ================= Supabase 조회 ================= */
const heatCache = new Map();

async function fetchHeat(zip) {
  if (!zip) return "정보없음";
  if (heatCache.has(zip)) return heatCache.get(zip);

  const url = `${SUPABASE_URL}/rest/v1/addr_map?addr_key=eq.${zip}&select=result&limit=1`;

  const res = await fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  });

  const data = await res.json();
  const result = data?.[0]?.result || "정보없음";
  heatCache.set(zip, result);
  return result;
}

/* ================= Kakao Map ================= */
kakao.maps.load(() => {

  const map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(36.3, 127.9),
    level: 11,
  });

  const geocoder = new kakao.maps.services.Geocoder();
  const places = new kakao.maps.services.Places();
  let marker = null;

  /* 🔥 핵심 수정 함수 */
  function pickAddr(r) {
    return {
      jibun:
        r.address_name ||
        (r.address && r.address.address_name) ||
        "",
      road:
        r.road_address_name ||
        (r.road_address && r.road_address.address_name) ||
        "",
      zip:
        r.zip_code ||
        (r.road_address && r.road_address.zone_no) ||
        "",
      x: Number(r.x),
      y: Number(r.y),
    };
  }

  function renderResult(list) {
    const box = document.getElementById("resultBox");
    const el = document.getElementById("resultList");
    el.innerHTML = "";
    box.classList.remove("hidden");

    list.forEach(r => {
      const a = pickAddr(r);

      const row = document.createElement("div");
      row.className = "px-4 py-3 border-b border-white/5 cursor-pointer hover:bg-white/5";
      row.innerHTML = `
        <div class="font-bold">${a.zip || "우편번호 확인 필요"}</div>
        <div class="text-sm">(지번) ${a.jibun || "-"}</div>
        <div class="text-xs text-slate-400">(도로명) ${a.road || "-"}</div>
      `;
      row.onclick = () => selectAddress(r);
      el.appendChild(row);
    });
  }

  window.searchAddress = () => {
    const keyword = addr.value.trim();
    if (!keyword) return alert("주소를 입력하세요");

    geocoder.addressSearch(keyword, (res, status) => {
      if (status === kakao.maps.services.Status.OK) {
        renderResult(res);
      } else {
        places.keywordSearch(keyword, (res2, stat) => {
          if (stat === kakao.maps.services.Status.OK) {
            renderResult(res2);
          } else {
            errorBox.textContent = "주소 검색 실패";
            errorBox.classList.remove("hidden");
          }
        });
      }
    });
  };

  async function selectAddress(r) {
    const a = pickAddr(r);
    const heat = await fetchHeat(a.zip);

    const info = document.getElementById("infoBox");
    info.className =
      "mt-4 px-5 py-4 rounded-2xl border " +
      (heat === "정보없음"
        ? "bg-amber-500/10 border-amber-400/30"
        : "bg-indigo-500/10 border-indigo-300/30");

    info.innerHTML = `
      <div class="text-xl font-extrabold">${a.zip || "우편번호 없음"}</div>
      <div class="mt-2 text-sm">(지번) ${a.jibun || "-"}</div>
      <div class="text-sm text-slate-400">(도로명) ${a.road || "-"}</div>
      <div class="mt-3 font-bold">
        ${heat === "정보없음"
          ? "해당 지역은 정보가 없는 지역입니다."
          : `해당 지역은 <span class="underline text-amber-400">${heat}</span> 설치지역입니다.`}
      </div>
    `;
    info.classList.remove("hidden");

    if (marker) marker.setMap(null);
    marker = new kakao.maps.Marker({
      map,
      position: new kakao.maps.LatLng(a.y, a.x),
    });
    map.setCenter(marker.getPosition());
    map.setLevel(5);
  }

});
</script>

</body>
</html>
